name: CI

on:
  push:
    branches:
      - main
      - reconstruction/**
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Capture public target evidence
        if: github.ref == 'refs/heads/reconstruction/m0-discovery'
        run: node scripts/capture-target-public.mjs

      - name: Upload public target evidence
        if: success() && github.ref == 'refs/heads/reconstruction/m0-discovery'
        uses: actions/upload-artifact@v4
        with:
          name: target-public-evidence
          path: target-evidence
          if-no-files-found: error
          retention-days: 7

      - name: E2E public contract
        run: npm run test:e2e -- --project=chromium
